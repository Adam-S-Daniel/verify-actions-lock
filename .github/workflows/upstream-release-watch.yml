name: upstream-release-watch
# Weekly: is there a gh-actions-lock release newer than the one this action
# pins (VERSION in scripts/install.sh) and past the fleet's 7-day wait? If so,
# scripts/upstream-watch.sh opens one issue for the owner, or moves the open
# one up to the newer release. Upstream tags come from `git ls-remote`; the
# script logs tags and issue numbers only.

on:
  schedule:
    - cron: '47 10 * * 1' # Mondays, off-peak minute
  workflow_dispatch:

permissions: {}

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check gh-actions-lock releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/upstream-watch.sh
